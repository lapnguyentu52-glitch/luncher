<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" href="/antares-logo.png" />
    <title>Antares Launcher</title>
    <style>
      /* Pre-mount splash — logo xịn hiện ngay (0ms) trước khi Vue mount */
      #app:empty + #pre-splash { opacity: 1; }
      #pre-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #07080c;
        opacity: 0;
        pointer-events: none;
        transition: opacity 240ms ease;
      }
      #pre-splash.on { opacity: 1; }
      .pre-splash__logo {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        animation: pre-splash-float 2.6s ease-in-out infinite;
        filter: drop-shadow(0 8px 28px rgba(0, 0, 0, 0.55));
      }
      .pre-splash__ring {
        position: absolute;
        width: 132px;
        height: 132px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.07);
        border-top-color: #ff5c47;
        animation: pre-splash-spin 1.1s linear infinite;
      }
      @keyframes pre-splash-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes pre-splash-float {
        0%, 100% { transform: translate3d(0, 0, 0); }
        50% { transform: translate3d(0, -7px, 0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .pre-splash__logo, .pre-splash__ring { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="pre-splash" class="on">
      <img src="/antares-logo.png" alt="" class="pre-splash__logo" />
      <div class="pre-splash__ring"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
