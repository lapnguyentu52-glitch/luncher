# Antares Launcher — Windows build (Tauri 2, toolchain MSVC)
# Chạy: tab Actions → "Windows build" → Run workflow (hoặc push tag v*).
name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Least privilege — workflow chỉ build + upload artifact.
permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # externalBin (tauri.conf.json) yêu cầu file có hậu tố target triple;
      # NSIS bundler tự strip triple khi cài → tên trần antares-legacy.exe.
      - name: Build legacy sidecar (PyInstaller)
        shell: bash
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --onefile \
            --name antares-legacy-x86_64-pc-windows-msvc \
            --paths . \
            --distpath src-tauri/binaries \
            --exclude-module webview --exclude-module pytest --exclude-module tkinter \
            legacy/python/sidecar.py

      # beforeBuildCommand trong tauri.conf.json tự build frontend (vue-tsc + vite)
      - name: Build (exe + NSIS installer)
        run: pnpm tauri build

      # Portable = exe thô + sidecar cạnh nhau (resolve trong core_state.rs).
      - name: Package portable (exe + sidecar)
        shell: bash
        run: |
          mkdir -p portable
          cp target/release/antares-desktop.exe portable/
          cp src-tauri/binaries/antares-legacy-x86_64-pc-windows-msvc.exe portable/
          7z a antares-portable-win64.zip ./portable/*

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: antares-windows-portable
          path: antares-portable-win64.zip
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: antares-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
