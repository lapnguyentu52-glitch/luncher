[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antares-launcher"
version = "3.0.0"
description = "Antares Launcher - game-first Minecraft launcher (Spark capability, service architecture)"
requires-python = ">=3.11"
dependencies = [
    "minecraft-launcher-lib>=8.0",
    "httpx>=0.27",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
gui = ["pywebview>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = { find = { include = ["app*", "core*", "services*", "infrastructure*", "api*"] } }
